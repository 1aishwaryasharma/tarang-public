plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.firetvtransport'
version = '0.1.0'

android {
  namespace "expo.modules.firetvtransport"
  defaultConfig {
    versionCode 1
    versionName "0.1.0"
  }
}

dependencies {
  implementation "com.squareup.okhttp3:okhttp:4.9.2"
}
